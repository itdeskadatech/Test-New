<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Higher.Study Training Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ============================================================
     ONE LINE TO EDIT: paste your deployed Apps Script Web App URL.
     It ends with /exec. See SETUP.md, step 5.
     This URL is not a secret: the backend checks identity on every call.
     ============================================================ -->
<script>window.HS_CONFIG = { apiUrl: "" };</script>
<style>
:root{
  --ink:#1B2230; --ink2:#2A3345; --muted:#5B6577; --line:#E2E6EE; --bg:#F4F6FA; --card:#FFFFFF;
  --orange:#F26A1B; --orange-d:#C94F0B; --orange-t:#FFF0E6; --ok:#17835A; --ok-t:#E3F5EC; --warn:#946200; --warn-t:#FFF4D6; --bad:#C23B2E; --bad-t:#FCE7E4;
  --r:10px; --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --head:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:.25rem 0 .75rem} a{color:var(--orange-d)} small,.muted{color:var(--muted)} .sm{font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
.busy-bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform .4s;z-index:100}
body.busy .busy-bar{transform:scaleX(.85)}
/* shell */
.app{display:flex;min-height:100vh}
.side{width:250px;background:var(--ink);color:#fff;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex:none}
.brand{font-family:var(--head);font-weight:700;font-size:1.2rem;padding:4px 10px 18px}
.brand b{color:var(--orange)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{color:#C9D0DE;text-decoration:none;padding:9px 12px;border-radius:8px;border-left:3px solid transparent}
.nav a:hover{background:var(--ink2);color:#fff}
.nav a.on{background:var(--ink2);color:#fff;border-left-color:var(--orange);font-weight:600}
.who{border-top:1px solid #38425A;padding:14px 10px 0;font-size:.85rem;color:#C9D0DE}
.who strong{display:block;color:#fff}
.who button{margin-top:10px}
.main{flex:1;min-width:0;padding:28px clamp(16px,3vw,40px) 60px;max-width:1280px}
.menu-btn{display:none}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.stack>*+*{margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card>h2,.card>h3{margin-bottom:10px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:#fff}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#B9C1D0}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}.btn.pri:hover{background:var(--orange-d)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--bad);border-color:#EBC3BE}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.side .btn{background:transparent;color:#fff;border-color:#4A5570}
label{display:block;font-weight:600;font-size:.85rem;margin-bottom:4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],input[type=date],select,textarea{width:100%;padding:9px 11px;border:1px solid #C9D0DE;border-radius:8px;background:#fff}
textarea{min-height:90px;resize:vertical}
.field{margin-bottom:14px} .field .hint{font-size:.8rem;color:var(--muted);margin-top:3px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;max-height:170px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:8px}
.checks label,.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:0}
.checks input,.chk input{width:auto}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
/* data */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#F9FAFC;font-weight:700;white-space:nowrap;font-size:.8rem;color:var(--muted)}
tr:last-child td{border-bottom:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:#EDF0F5;color:var(--muted)}
.badge.ok{background:var(--ok-t);color:var(--ok)}.badge.warn{background:var(--warn-t);color:var(--warn)}.badge.bad{background:var(--bad-t);color:var(--bad)}.badge.org{background:var(--orange-t);color:var(--orange-d)}
.bar{height:8px;background:#E9ECF2;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);border-radius:9px}
.bar.ok i{background:var(--ok)}
/* employee */
.active-panel{background:var(--ink);color:#fff;border-radius:14px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-bottom:20px}
.active-panel small{color:#C9D0DE}.active-panel h2{font-size:1.6rem;margin:2px 0 12px}
.active-panel .bar{background:#38425A;max-width:420px}
.active-panel.idle{background:var(--orange-t);color:var(--ink);border:1px solid #F7CBAE}.active-panel.idle small{color:var(--muted)}
.college{display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--line)}
.college.st-active{border-left-color:var(--orange)} .college.st-completed{border-left-color:var(--ok)} .college.st-locked{background:#F9FAFC;border-left-color:#B9C1D0}
.college .top{display:flex;gap:12px;align-items:center;justify-content:space-between}
.logo{width:42px;height:42px;border-radius:9px;background:var(--orange-t);color:var(--orange-d);display:grid;place-items:center;font-family:var(--head);font-weight:700;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
.lock-note{font-size:.85rem;color:var(--muted);background:#EDF0F5;border-radius:8px;padding:8px 10px}
.college .foot{margin-top:auto}
details.mod{border:1px solid var(--line);border-radius:var(--r);background:#fff}
details.mod>summary{padding:14px 16px;cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.mod>summary::-webkit-details-marker{display:none}
.lesson{border-top:1px solid var(--line);padding:16px}
.lesson .body{white-space:pre-wrap;margin:8px 0}
.lesson img{max-width:100%;border-radius:8px;margin:8px 0}
.video{position:relative;padding-top:56.25%;margin:8px 0;border-radius:8px;overflow:hidden;background:#000}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tick{color:var(--ok);font-weight:700}
.timer{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:flex;justify-content:space-between;margin-bottom:16px}
.q{margin-bottom:14px}.q .opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:500;margin:0}
.opt:has(input:checked){border-color:var(--orange);background:var(--orange-t)}.opt input{width:auto;margin-top:4px}
.score{font-family:var(--head);font-size:3.2rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}.stat b{display:block;font-family:var(--head);font-size:1.7rem}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth .card{width:min(460px,100%);padding:28px}
.auth h1{margin-bottom:4px}
.alert{padding:10px 12px;border-radius:8px;font-size:.9rem;margin-bottom:12px;background:var(--warn-t);color:#5C3F00}
/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(20,26,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{width:min(860px,100%)}
.modal>header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mb{padding:20px}.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.x{background:none;border:0;font-size:1.5rem;cursor:pointer;line-height:1}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:200}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;max-width:360px;font-weight:500}.toast.err{background:var(--bad)}
.optrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}.optrow input[type=text]{flex:1}.optrow input[type=radio],.optrow input[type=checkbox]{width:auto}
.errlist{max-height:240px;overflow:auto;font-size:.85rem}
@media (max-width:860px){
  .app{display:block}
  .side{position:fixed;inset:0 25% 0 0;width:auto;max-width:300px;z-index:60;transform:translateX(-102%);transition:transform .2s;height:100%}
  body.nav-open .side{transform:none}
  .menu-btn{display:inline-flex;position:sticky;top:8px;margin:8px 0 0 12px;z-index:20}
  .active-panel{grid-template-columns:1fr}
  .main{padding-top:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="busy-bar"></div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
const API=(window.HS_CONFIG||{}).apiUrl||'';
const S={token:localStorage.getItem('hs_token')||'',user:null,info:{portalName:'Higher.Study Training',managers:[],allowRegistration:true,passwordMinLength:10}};
let L=null, rid=0, pending=0;

/* ---------- utilities ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=s=>s?new Date(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—';
const fdt=s=>s?new Date(s).toLocaleString(undefined,{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const bool=v=>v===true||String(v).toLowerCase()==='true';
const first=n=>String(n||'').split(' ')[0];
const linkify=t=>esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
const bar=(p,ok)=>`<div class="bar ${ok?'ok':''}" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
const badge=(t,k)=>`<span class="badge ${k||''}">${esc(t)}</span>`;
const stBadge=s=>badge(s,{published:'ok',active:'ok',completed:'ok',draft:'warn',pending:'warn','in progress':'org',archived:'',inactive:'',disabled:'bad',rejected:'bad',locked:''}[s]||'');
function toast(m,k){const t=document.createElement('div');t.className='toast '+(k||'');t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),k==='err'?6000:3500)}
function busy(){document.body.classList.toggle('busy',pending>0)}
async function api(action,data){
  if(!API) throw new Error('The backend is not connected yet. Set apiUrl at the top of index.html (see SETUP.md, step 5).');
  pending++;busy();
  try{
    let res; try{res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S.token,data:data||{}})})}
    catch(e){throw new Error('Cannot reach the server. Check your connection and the apiUrl setting.')}
    const j=await res.json();
    if(!j.ok){ if(j.code==='auth'&&S.token) signOut(true); const e=new Error(j.error||'Request failed');e.code=j.code;throw e }
    return j.data;
  } finally{pending--;busy()}
}
function setToken(t){S.token=t||'';t?localStorage.setItem('hs_token',t):localStorage.removeItem('hs_token')}
function signOut(expired){ setToken('');S.user=null;L=null;location.hash='#/login';route(); if(expired)toast('Your session expired. Sign in again.','err') }
function downloadCsv(name,cols,rows){
  const q=v=>{v=String(v==null?'':v); if(/^[=+\-@]/.test(v))v="'"+v; return '"'+v.replace(/"/g,'""')+'"'};
  const csv=[cols].concat(rows).map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function embed(u){
  if(!/^https?:\/\//i.test(u||''))return '';
  let m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/); if(m)return `<div class="video"><iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen loading="lazy" title="Training video"></iframe></div>`;
  m=u.match(/vimeo\.com\/(\d+)/); if(m)return `<div class="video"><iframe src="https://player.vimeo.com/video/${m[1]}" allowfullscreen loading="lazy" title="Training video"></iframe></div>`;
  m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/); if(m)return `<div class="video"><iframe src="https://drive.google.com/file/d/${m[1]}/preview" allowfullscreen loading="lazy" title="Training video"></iframe></div>`;
  return `<p><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Open video</a></p>`;
}
function table(cols,rows,empty){
  if(!rows.length)return `<div class="empty">${esc(empty||'Nothing here yet.')}</div>`;
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const sel=(name,opts,val,blank)=>`<select name="${name}">${blank!==undefined?`<option value="">${esc(blank)}</option>`:''}${opts.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(val)?'selected':''}>${esc(o.l)}</option>`).join('')}</select>`;

/* ---------- modal / forms ---------- */
function modal({title,body,wide,actions,onOpen}){
  const root=$('#modal-root'),el=document.createElement('div');el.className='ov';
  el.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="x" data-close aria-label="Close">&times;</button></header><div class="mb">${body}</div>${actions&&actions.length?'<footer></footer>':''}</div>`;
  const ctl={el,close(){el.remove()},$:s=>$(s,el)};
  (actions||[]).forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.cls||'');b.textContent=a.label;b.onclick=async()=>{b.disabled=true;try{const r=await a.fn(ctl); if(r===false)b.disabled=false}catch(e){toast(e.message,'err');b.disabled=false}};$('footer',el).appendChild(b)});
  el.addEventListener('click',e=>{if(e.target===el||e.target.hasAttribute('data-close'))ctl.close()});
  root.appendChild(el); const f=$('input,select,textarea',el); if(f)f.focus(); if(onOpen)onOpen(ctl); return ctl;
}
const confirmDlg=(msg,label,danger)=>new Promise(res=>{let done=false;const m=modal({title:'Please confirm',body:`<p>${esc(msg)}</p>`,actions:[{label:'Cancel',fn:c=>{done=true;c.close();res(false)}},{label:label||'Confirm',cls:danger?'danger':'pri',fn:c=>{done=true;c.close();res(true)}}]});m.el.addEventListener('click',e=>{if(!done&&(e.target===m.el||e.target.hasAttribute('data-close'))){done=true;res(false)}})});
function fieldHtml(f,v){
  const id='f_'+f.k, req=f.req?' required':'', h=f.hint?`<div class="hint">${esc(f.hint)}</div>`:'';
  let inner;
  if(f.t==='textarea')inner=`<label for="${id}">${esc(f.l)}</label><textarea id="${id}" name="${f.k}"${req} ${f.rows?`style="min-height:${f.rows*24}px"`:''}>${esc(v)}</textarea>`;
  else if(f.t==='select')inner=`<label for="${id}">${esc(f.l)}</label>${sel(f.k,f.o,v,f.blank).replace('<select','<select id="'+id+'"'+req)}`;
  else if(f.t==='bool')inner=`<label class="chk"><input type="checkbox" name="${f.k}" ${bool(v)?'checked':''}> ${esc(f.l)}</label>`;
  else if(f.t==='multi'){const cur=String(v||'').split(',').map(s=>s.trim());inner=`<label>${esc(f.l)}</label><div class="checks">${f.o.length?f.o.map(o=>`<label><input type="checkbox" name="${f.k}" value="${esc(o.v)}" ${cur.includes(String(o.v))?'checked':''}> ${esc(o.l)}</label>`).join(''):'<span class="muted sm">No options available yet.</span>'}</div>`}
  else if(f.t==='rule'){const r=(()=>{try{return JSON.parse(v||'{}')||{}}catch(e){return{}}})();const c=(k)=>r[k]!==false;
    inner=`<label>Completion rules</label><div class="checks" data-rule="${f.k}"><label><input type="checkbox" data-r="requireAllMandatory" ${c('requireAllMandatory')?'checked':''}> All mandatory lessons completed</label><label><input type="checkbox" data-r="requireAssessments" ${c('requireAssessments')?'checked':''}> Required assessments completed</label><label><input type="checkbox" data-r="requirePassing" ${c('requirePassing')?'checked':''}> Passing score required</label></div>`}
  else inner=`<label for="${id}">${esc(f.l)}</label><input id="${id}" type="${f.t||'text'}" name="${f.k}" value="${esc(v)}"${req} ${f.step?`step="${f.step}"`:''} ${f.min!==undefined?`min="${f.min}"`:''}>`;
  return `<div class="field">${inner}${h}</div>`;
}
function readForm(root,fields){
  const o={};
  fields.forEach(f=>{
    if(f.t==='bool')o[f.k]=!!$(`[name="${f.k}"]`,root).checked;
    else if(f.t==='multi')o[f.k]=$$(`[name="${f.k}"]:checked`,root).map(x=>x.value);
    else if(f.t==='rule'){const r={};$$(`[data-rule="${f.k}"] [data-r]`,root).forEach(c=>r[c.dataset.r]=c.checked);o[f.k]=JSON.stringify(r)}
    else o[f.k]=$(`[name="${f.k}"]`,root).value;
  });
  return o;
}
function formModal({title,fields,values,label,onSave,wide,extra}){
  values=values||{};
  return modal({title,wide,body:`<form onsubmit="return false"><div class="${wide?'fgrid':''}">${fields.map(f=>fieldHtml(f,values[f.k])).join('')}</div>${extra||''}</form>`,
    actions:[{label:'Cancel',fn:c=>c.close()},{label:label||'Save',cls:'pri',fn:async c=>{
      const f=$('form',c.el); const bad=$$('[required]',f).find(x=>!String(x.value).trim()); if(bad){bad.focus();toast('Fill in all required fields.','err');return false}
      await onSave(readForm(f,fields),c); }}]});
}

/* ---------- routing ---------- */
const NAV={
  employee:[['/','Dashboard'],['/results','My results'],['/account','Account']],
  manager:[['/','My team'],['/reports','Reports'],['/account','Account']],
  admin:[['/','Overview'],['/users','Users'],['/colleges','Colleges'],['/modules','Modules'],['/questions','Question bank'],['/import','Import questions'],['/assessments','Assessments'],['/announcements','Announcements'],['/reports','Reports'],['/audit','Audit log'],['/settings','Settings'],['/account','Account']]
};
const R={
  employee:[[/^\/$/,vDash],[/^\/college\/([\w-]+)$/,vCollege],[/^\/assess\/([\w-]+)$/,vAssess],[/^\/results$/,vResults],[/^\/account$/,vAccount]],
  manager:[[/^\/$/,vTeam],[/^\/employee\/([\w-]+)$/,vEmpReport],[/^\/reports$/,vReports],[/^\/account$/,vAccount]],
  admin:[[/^\/$/,vAdminHome],[/^\/users$/,vUsers],[/^\/colleges$/,vColleges],[/^\/college\/([\w-]+)$/,vCollegeAdmin],[/^\/modules$/,vModules],[/^\/module\/([\w-]+)$/,vModuleAdmin],[/^\/questions$/,vQuestions],[/^\/import$/,vImport],[/^\/assessments$/,vAssessments],[/^\/announcements$/,vAnnounce],[/^\/reports$/,vReports],[/^\/audit$/,vAudit],[/^\/settings$/,vSettings],[/^\/account$/,vAccount]]
};
function route(){
  const path=(location.hash.slice(1)||'/').split('?')[0], my=++rid;
  document.body.classList.remove('nav-open');
  if(!S.user){return authView(path)}
  if(['/login','/register','/reset'].includes(path)){location.hash='#/';return}

async function vAssess(id){
  const a=await api('emp.startAssessment',{assessmentId:id});
  const off=Date.now()-new Date(a.serverNow).getTime(), dl=a.deadline?new Date(a.deadline).getTime()+off:0;
  const qh=a.questions.map((q,i)=>{
    let inp;
    if(q.type==='single')inp=q.options.map(o=>`<label class="opt"><input type="radio" name="q_${esc(q.questionId)}" value="${esc(o.optionId)}"> ${esc(o.text)}</label>`).join('');
    else if(q.type==='multi')inp=q.options.map(o=>`<label class="opt"><input type="checkbox" name="q_${esc(q.questionId)}" value="${esc(o.optionId)}"> ${esc(o.text)}</label>`).join('');
    else if(q.type==='tf')inp=['true','false'].map(v=>`<label class="opt"><input type="radio" name="q_${esc(q.questionId)}" value="${v}"> ${v==='true'?'True':'False'}</label>`).join('');
    else inp=`<input type="text" name="q_${esc(q.questionId)}" autocomplete="off" placeholder="Your answer">`;
    return `<div class="card q" data-q="${esc(q.questionId)}" data-t="${esc(q.type)}"><b>${i+1}. ${esc(q.text)}</b> <span class="sm muted">(${esc(q.marks)} mark${q.marks==1?'':'s'}${q.type==='multi'?', select all that apply':''})</span><div class="opts">${inp}</div></div>`}).join('');
  const submit=async(auto)=>{
    const ans={};$$('.q').forEach(el=>{const id=el.dataset.q,t=el.dataset.t;
      if(t==='multi')ans[id]=$$('input:checked',el).map(x=>x.value);else if(t==='short')ans[id]=$('input',el).value;else{const c=$('input:checked',el);ans[id]=c?c.value:''}});
    if(!auto&&!await confirmDlg('Submit your answers? You cannot change them afterwards.','Submit'))return;
    clearInterval(window.__tm);const r=await api('emp.submitAssessment',{attemptId:a.attemptId,answers:ans});$('#main').innerHTML=resultHtml(a,r);
  };
  window.__submit=submit;
  return {html:`<div class="page-h"><div><h1>${esc(a.assessment.name)}</h1><p class="muted">Attempt ${esc(a.attemptNo)}. Pass mark ${esc(a.assessment.passPercent)}%. Total ${esc(a.totalMarks)} marks.</p></div></div>
    <div class="timer"><span>${a.questions.length} questions</span><b id="clock">${dl?'':'No time limit'}</b></div>${qh}<button class="btn pri" data-a="submitasm">Submit answers</button>`,
    after(){ clearInterval(window.__tm); if(dl){const tick=()=>{const s=Math.max(0,Math.round((dl-Date.now())/1000));const c=$('#clock');if(!c){clearInterval(window.__tm);return}c.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} left`;if(s<=0){clearInterval(window.__tm);toast('Time is up. Submitting your answers.');submit(true).catch(e=>toast(e.message,'err'))}};tick();window.__tm=setInterval(tick,1000)} }};
}

  ${r.review?`<h2 style="margin:20px 0 10px">Review</h2>${r.review.map((x,i)=>`<div class="card" style="margin-bottom:10px"><b>${i+1}. ${esc(x.text)}</b> ${x.correct?badge('Correct','ok'):badge('Incorrect','bad')}${x.yourAnswer!==undefined?`<div class="sm">Your answer: ${esc(x.yourAnswer)||'<i>none</i>'}</div><div class="sm">Correct answer: ${esc(x.correctAnswer)}</div>`:''}${x.explanation?`<p class="sm muted">${esc(x.explanation)}</p>`:''}</div>`).join('')}`:''}`;
}

/* ================= ADMIN ================= */
async function loadL(force){
  if(L&&!force)return L;
  const g=t=>api('admin.list',{table:t});
  const [colleges,modules,campuses,courses,assessments,users]=await Promise.all([g('colleges'),g('modules'),g('campuses'),g('courses'),g('assessments'),api('admin.users')]);
  L={colleges,modules,campuses,courses,assessments,users:users.users,assignments:users.assignments};return L;
}
const opt=(arr,v,l)=>arr.map(x=>({v:x[v],l:x[l]}));
const nameOf=(arr,key,id,f='name')=>{const x=arr.find(r=>r[key]===id);return x?x[f]:id||'—'};
async function adminSave(table,item){const r=await api('admin.save',{table,item});L=null;return r}

async function vAdminHome(){
  const s=await api('admin.stats'),pct=s.questionTarget?Math.min(100,Math.round(s.activeQuestions*100/s.questionTarget)):0;
  const empty=!s.collegesTotal;
  return `<div class="page-h"><h1>Overview</h1></div>
  ${empty?`<div class="alert"><b>College data is awaiting import.</b> No colleges exist yet. Add them under <a href="#/colleges">Colleges</a>, or load your master training document there. Nothing is pre-filled, so no college details are invented.</div>`:''}
  <div class="stats"><div class="stat"><b>${s.pendingUsers}</b>Accounts awaiting approval</div><div class="stat"><b>${s.activeUsers}</b>Active users</div><div class="stat"><b>${s.colleges}</b>Published colleges</div><div class="stat"><b>${s.modules}</b>Published modules</div><div class="stat"><b>${s.assessments}</b>Published assessments</div></div>
  <div class="card"><h2>Question bank</h2><p><b>${s.activeQuestions.toLocaleString()}</b> active questions of a target of <b>${s.questionTarget.toLocaleString()}</b>. <b>${s.questionsRemaining.toLocaleString()}</b> remaining.</p>${bar(pct)}<p class="sm muted" style="margin-top:8px">These are real imported records. Nothing is generated to reach the target.</p></div>
  <div class="row" style="margin-top:16px">${s.pendingUsers?`<a class="btn pri" href="#/users">Review ${s.pendingUsers} pending account(s)</a>`:''}<a class="btn" href="#/colleges">Manage colleges</a><a class="btn" href="#/import">Import questions</a></div>`;
}

/* --- users --- */
async function vUsers(){
  await loadL(true);const us=L.users,mgrs=us.filter(u=>u.role==='manager'&&u.status==='active');
  const pend=us.filter(u=>u.status==='pending');
  const acts=u=>{
    const a=[];
    if(u.status==='pending'){a.push(`<button class="btn sm pri" data-a="uapprove" data-id="${esc(u.userId)}">Review</button>`,`<button class="btn sm danger" data-a="uop" data-op="reject" data-id="${esc(u.userId)}">Reject</button>`)}
    else if(u.isPrimary){a.push('<span class="muted sm">Primary admin</span>')}
    else{
      if(u.status==='active'&&u.role==='employee')a.push(`<button class="btn sm" data-a="umgr" data-id="${esc(u.userId)}">Manager</button>`,`<button class="btn sm" data-a="uaccess" data-id="${esc(u.userId)}">Extra access</button>`,`<button class="btn sm" data-a="ulock" data-id="${esc(u.userId)}">Release lock</button>`);
      if(u.status==='active')a.push(`<button class="btn sm" data-a="urole" data-id="${esc(u.userId)}">Role</button>`);
      if(u.userId!==S.user.userId)a.push(u.status==='active'?`<button class="btn sm danger" data-a="uop" data-op="disable" data-id="${esc(u.userId)}">Disable</button>`:`<button class="btn sm" data-a="uop" data-op="enable" data-id="${esc(u.userId)}">Enable</button>`);
    }
    return `<div class="acts">${a.join('')}</div>`};
  const row=u=>[`<b>${esc(u.fullName)}</b><div class="sm muted">${esc(u.email)}${u.employeeId?'<br>ID '+esc(u.employeeId):''}</div>`,esc(u.jobTitle),`${esc(u.role)}${u.status==='pending'&&u.requestedRole==='manager'?'<br>'+badge('Requested manager','warn'):''}`,stBadge(u.status),esc(u.role==='employee'?nameOf(us,'userId',u.managerId,'fullName'):'—'),acts(u)];
  return `<div class="page-h"><h1>Users</h1></div>${pend.length?`<h2 style="margin-bottom:10px">Awaiting approval (${pend.length})</h2>${table(['Name','Role','Account','Status','Manager',''],pend.map(row))}`:''}
  <h2 style="margin:20px 0 10px">All users</h2>${table(['Name','Job role','Account','Status','Manager',''],us.filter(u=>u.status!=='pending').map(row),'No other users yet.')}`;
}

function questionForm(g){

   <div class="fgrid"><div class="field"><label>Marks</label><input type="number" name="marks" min="0.5" step="0.5" value="${esc(q.marks)}"></div><div class="field"><label>Difficulty</label><select name="difficulty"><option>easy</option><option>medium</option><option>hard</option></select></div><div class="field"><label>Status</label><select name="status"><option value="active">Active</option><option value="inactive">Inactive</option><option value="archived">Archived</option></select></div></div>
   <label class="chk"><input type="checkbox" name="required" ${bool(q.required)?'checked':''}> Required question</label></form>`;
  modal({title:g?'Edit question':'Add question',wide:true,body:html,onOpen:c=>{
    const f=$('form',c.el),setO=(el,list,v)=>{el.innerHTML=(v!==undefined?'<option value="">'+(el.name==='collegeId'||el.name==='moduleId'?'Select…':'None')+'</option>':'')+list.map(o=>`<option value="${esc(o.v)}">${esc(o.l)}</option>`).join('')};

    setO(f.collegeId,opt(L.colleges.filter(x=>x.status!=='archived'),'collegeId','name'),'');f.collegeId.value=q.collegeId||'';refresh();
    f.moduleId.value=q.moduleId||'';f.campusId.value=q.campusId||'';f.courseId.value=q.courseId||'';f.type.value=q.type;f.difficulty.value=q.difficulty||'medium';f.status.value=q.status||'active';
    if(q.type==='tf')f.tf.value=String(q.correctAnswer).toLowerCase();if(q.type==='short')f.short.value=String(q.correctAnswer||'').split('|').join('\n');

        box.innerHTML=`<label>Answer options (${t==='single'?'mark the one correct answer':'tick every correct answer'})</label>`+list.map((o,i)=>`<div class="optrow"><input data-c type="${t==='single'?'radio':'checkbox'}" name="corr" ${o.isCorrect?'checked':''} aria-label="Correct"><input type="text" value="${esc(o.text)}" placeholder="Option ${i+1}"><button type="button" class="btn sm danger" data-rm>&times;</button></div>`).join('')+'<button type="button" class="btn sm" data-add>Add option</button>';

        correctAnswer:t==='tf'?f.tf.value:t==='short'?f.short.value.split('\n').map(s=>s.trim()).filter(Boolean).join('|'):''};
      if(g)body.questionId=g.question.questionId;await api('admin.saveQuestion',{question:body,options});c.close();toast('Question saved');route()}}]});

document.addEventListener('change',async e=>{
  if(e.target.id!=='impfile'||!e.target.files[0])return;const f=e.target.files[0],out=$('#impout');

    out.innerHTML=`<div class="stats"><div class="stat"><b>${pv.total}</b>Rows in file</div><div class="stat"><b style="color:var(--ok)">${pv.validCount}</b>Valid</div><div class="stat"><b style="color:var(--bad)">${pv.invalidCount}</b>Invalid</div><div class="stat"><b>${Math.max(0,pv.target-pv.activeNow-pv.validCount).toLocaleString()}</b>Remaining after import</div></div>

ACT.impgo=async el=>{
  if(!IMP)return;if(!await confirmDlg(`Import ${IMP.pv.validCount} valid question(s)? ${IMP.pv.invalidCount} invalid row(s) will not be imported.`,'Import'))return;
  el.disabled=true;const id='imp_'+Date.now().toString(36),size=500;let ok=0,bad=0,errs=[],last;
  for(let i=0;i<IMP.rows.length;i+=size){last=await api('admin.importCommit',{rows:IMP.rows.slice(i,i+size),importId:id,fileName:IMP.name});ok+=last.imported;bad+=last.failed;errs=errs.concat(last.errors.map(x=>({line:x.line+i,errors:x.errors})))}
  $('#impout').innerHTML=`<h3>Import summary</h3><div class="stats"><div class="stat"><b style="color:var(--ok)">${ok}</b>Imported</div><div class="stat"><b style="color:var(--bad)">${bad}</b>Failed</div><div class="stat"><b>${last.activeNow.toLocaleString()}</b>Active questions</div><div class="stat"><b>${last.remaining.toLocaleString()}</b>Remaining to target</div></div>
   ${errs.length?`<div class="errlist">${table(['Row','Problems'],errs.map(x=>[esc(x.line),esc(x.errors.join('; '))]))}</div>`:''}<p style="margin-top:12px"><a class="btn" href="#/questions">View question bank</a></p>`;IMP=null;toast('Import finished');
};

/* --- assessments --- */
const ASM_F=()=>[{k:'name',l:'Assessment name',req:true},{k:'collegeId',l:'College',t:'select',o:opt(L.colleges.filter(c=>c.status!=='archived'),'collegeId','name'),req:true,blank:'Select a college'},{k:'moduleId',l:'Module (optional)',t:'select',o:opt(L.modules.filter(m=>m.status!=='archived'),'moduleId','name'),blank:'Whole college'},
  {k:'mode',l:'Question selection',t:'select',o:[{v:'fixed',l:'Specific questions I choose'},{v:'random',l:'Draw randomly from the question bank'}]},{k:'drawCount',l:'Questions to draw (random mode)',t:'number',min:0},{k:'passPercent',l:'Passing percentage',t:'number',min:1,req:true},{k:'timeLimitMin',l:'Time limit in minutes (0 = none)',t:'number',min:0},{k:'maxAttempts',l:'Maximum attempts (0 = unlimited)',t:'number',min:0},
  {k:'shuffleQuestions',l:'Randomise question order',t:'bool'},{k:'shuffleOptions',l:'Randomise answer options',t:'bool'},{k:'revealAnswers',l:'Show correct answers after submission',t:'bool'},{k:'revealExplanations',l:'Show explanations after submission',t:'bool'},{k:'required',l:'Required for college completion',t:'bool'}];
async function vAssessments(){
  await loadL(true);
  return `<div class="page-h"><div><h1>Assessments</h1><p class="muted">Scoring happens on the server. Answer keys never reach the employee's browser.</p></div><button class="btn pri" data-a="addasm">Add assessment</button></div>
  ${table(['Assessment','College / module','Pass mark','Limits','Status',''],L.assessments.map(a=>[`<b>${esc(a.name)}</b><div class="sm muted">${a.mode==='random'?'Random, '+esc(a.drawCount)+' questions':'Fixed set, '+esc(a.totalMarks||0)+' marks'}${bool(a.required)?', required':''}</div>`,`${esc(nameOf(L.colleges,'collegeId',a.collegeId))}<div class="sm muted">${esc(a.moduleId?nameOf(L.modules,'moduleId',a.moduleId):'Whole college')}</div>`,esc(a.passPercent)+'%',`${a.timeLimitMin&&a.timeLimitMin!=='0'?esc(a.timeLimitMin)+' min':'No time limit'}, ${a.maxAttempts&&a.maxAttempts!=='0'?esc(a.maxAttempts)+' attempts':'unlimited attempts'}`,stBadge(a.status),
   `<div class="acts">${a.mode!=='random'?`<button class="btn sm" data-a="asmq" data-id="${esc(a.assessmentId)}">Questions</button>`:''}<button class="btn sm" data-a="editasm" data-id="${esc(a.assessmentId)}">Edit</button>${a.status==='published'?`<button class="btn sm" data-a="astat" data-id="${esc(a.assessmentId)}" data-s="draft">Unpublish</button>`:`<button class="btn sm pri" data-a="astat" data-id="${esc(a.assessmentId)}" data-s="published">Publish</button>`}<button class="btn sm danger" data-a="archasm" data-id="${esc(a.assessmentId)}">Archive</button></div>`]),'No assessments yet.')}`;
}
ACT.addasm=()=>formModal({title:'Add assessment',fields:ASM_F(),values:{mode:'fixed',passPercent:70,maxAttempts:3,timeLimitMin:0,shuffleQuestions:true,shuffleOptions:true,required:true},wide:true,onSave:async(v,c)=>{await adminSave('assessments',v);c.close();toast('Assessment saved as draft. Choose its questions, then publish.');route()}});
ACT.editasm=el=>{const a=L.assessments.find(x=>x.assessmentId===el.dataset.id);formModal({title:'Edit assessment',fields:ASM_F(),values:a,wide:true,onSave:async(v,c)=>{v.assessmentId=a.assessmentId;await adminSave('assessments',v);c.close();toast('Saved');route()}})};
ACT.astat=async el=>{await api('admin.setStatus',{table:'assessments',id:el.dataset.id,status:el.dataset.s});L=null;toast(el.dataset.s==='published'?'Published':'Unpublished');route()};
ACT.archasm=async el=>{if(!await confirmDlg('Archive this assessment? Past attempts are kept.','Archive',true))return;await api('admin.remove',{table:'assessments',id:el.dataset.id});L=null;toast('Archived');route()};
ACT.asmq=async el=>{
  const a=L.assessments.find(x=>x.assessmentId===el.dataset.id);
  const [pool,cur]=await Promise.all([api('admin.questions',{filter:{collegeId:a.collegeId,status:'active',...(a.moduleId?{moduleId:a.moduleId}:{})},limit:200}),api('admin.assessmentQuestions',{assessmentId:a.assessmentId})]);
  const sel2=new Set(cur);
  modal({title:'Questions for '+a.name,wide:true,body:`<p class="sm muted">Active questions for this ${a.moduleId?'module':'college'}. Tick the ones to include (max 60 per attempt).${pool.total>200?' Showing the first 200; use Import with an assessmentId column to attach more.':''}</p><div class="field"><input type="text" id="qsr" placeholder="Search…"></div><div class="checks" style="max-height:380px;flex-direction:column;flex-wrap:nowrap" id="qlist">${pool.rows.length?pool.rows.map(q=>`<label data-t="${esc((q.text+' '+q.topic).toLowerCase())}"><input type="checkbox" value="${esc(q.questionId)}" ${sel2.has(q.questionId)?'checked':''}> <span>${esc(q.text.slice(0,140))} <span class="muted sm">(${esc(q.marks)} marks)</span></span></label>`).join(''):'<span class="muted">No active questions for this college yet. Add or import some first.</span>'}</div><p class="sm" id="qcount"></p>`,
   onOpen:c=>{const upd=()=>{$('#qcount',c.el).textContent=$$('#qlist input:checked',c.el).length+' selected'};upd();$('#qlist',c.el).onchange=upd;$('#qsr',c.el).oninput=e=>{const t=e.target.value.toLowerCase();$$('#qlist label',c.el).forEach(l=>l.style.display=l.dataset.t.includes(t)?'':'none')}},
   actions:[{label:'Cancel',fn:c=>c.close()},{label:'Save selection',cls:'pri',fn:async c=>{const ids=$$('#qlist input:checked',c.el).map(x=>x.value),r=await api('admin.setAssessmentQuestions',{assessmentId:a.assessmentId,questionIds:ids});L=null;c.close();toast(`${r.count} question(s), ${r.totalMarks} marks`);route()}}]})};

/* --- announcements, audit, settings --- */
async function vAnnounce(){
  await loadL();const ns=await api('admin.list',{table:'notifications'});
  return `<div class="page-h"><h1>Announcements</h1><button class="btn pri" data-a="addann">New announcement</button></div>${table(['Title','Audience','Posted','Status',''],ns.filter(n=>n.createdBy!=='system').reverse().map(n=>[`<b>${esc(n.title)}</b><div class="sm">${esc(n.body)}</div>`,esc(n.audience==='user'?nameOf(L.users,'userId',n.userId,'fullName'):n.audience),fd(n.createdAt),stBadge(n.status),n.status==='active'?`<button class="btn sm danger" data-a="annoff" data-id="${esc(n.notificationId)}">Remove</button>`:''] ),'No announcements yet.')}`;
}
ACT.addann=()=>formModal({title:'New announcement',fields:[{k:'title',l:'Title',req:true},{k:'body',l:'Message',t:'textarea'},{k:'audience',l:'Send to',t:'select',o:[{v:'all',l:'Everyone'},{v:'employee',l:'Employees'},{v:'manager',l:'Managers'}]}],values:{audience:'all'},onSave:async(v,c)=>{v.status='active';await api('admin.save',{table:'notifications',item:v});c.close();toast('Posted');route()}});
ACT.annoff=async el=>{await api('admin.remove',{table:'notifications',id:el.dataset.id});toast('Removed');route()};
async function vAudit(){
  const rows=await api('admin.audit',{});
  return `<div class="page-h"><h1>Audit log</h1><p class="muted">Latest 300 actions. Search by action, email or record ID.</p></div><div class="field" style="max-width:360px"><input type="text" id="auq" placeholder="Search…"></div><div id="auout">${auTable(rows)}</div>`;
}
const auTable=rows=>table(['When','Who','Action','Target','Details'],rows.map(r=>[fdt(r.timestamp),esc(r.actorEmail||r.actorId),`<b>${esc(r.action)}</b>`,esc(r.targetType+' '+r.targetId),`<span class="sm">${esc(String(r.details).slice(0,160))}</span>`]),'No matching entries.');
document.addEventListener('input',e=>{if(e.target.id!=='auq')return;clearTimeout(window.__aut);window.__aut=setTimeout(async()=>{$('#auout').innerHTML=auTable(await api('admin.audit',{q:e.target.value}))},350)});
async function vSettings(){
  const s=await api('admin.getSettings');
  return `<div class="page-h"><h1>Portal settings</h1></div><div class="card" style="max-width:640px"><form data-form="settings">${[['portalName','Portal name'],['questionTarget','Question bank target'],['passwordMinLength','Minimum password length'],['defaultPassPercent','Default passing percentage'],['supportEmail','Support email']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" type="text" value="${esc(s[k])}"></div>`).join('')}
  <label class="chk" style="margin-bottom:14px"><input type="checkbox" name="allowRegistration" ${bool(s.allowRegistration)?'checked':''}> Allow new registrations</label><button class="btn pri" type="submit">Save settings</button></form></div>`;
}
FORM.settings=async f=>{const d=Object.fromEntries(new FormData(f));d.allowRegistration=!!$('[name=allowRegistration]',f).checked;await api('admin.saveSettings',d);toast('Settings saved')};

/* ---------- boot ---------- */
(async function boot(){
  try{S.info=Object.assign(S.info,await api('publicInfo'))}catch(e){}
  if(S.token){try{S.user=await api('me')}catch(e){setToken('')}}
  document.title=S.info.portalName;route();
})();
})();
</script>
</body>
</html>
